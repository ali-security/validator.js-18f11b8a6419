name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha spec path(s) to run instead of the full suite'
        required: false
        default: ''
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 18, 16, 14, 12, 10, 8, 6]
    name: Run tests on Node.js ${{ matrix.node-version }}
    steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2-beta
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Pin npm registry to release date (time machine)
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2024-05-09T05:15:53.058000Z
    - name: Install dependencies
      run:  npm install --legacy-peer-deps
    - name: Run tests
      run: npm test -- ${{ inputs.test-filter }}
    - if: matrix.node-version == 20
      name: Pack tarball
      run: npm pack
    - if: matrix.node-version == 20
      name: Upload tarball
      uses: actions/upload-artifact@v4
      with:
        name: validator-tgz
        path: validator-*.tgz
        if-no-files-found: error
